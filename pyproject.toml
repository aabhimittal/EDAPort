[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edaport"
version = "0.1.0"
description = "Typed, size-bounded, replayable MCP tools for open-source EDA"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }  # matches LICENSE; spec draft says Apache-2.0, owner to decide
dependencies = ["mcp>=2.3", "pydantic>=2.7"]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4", "cocotb>=2", "boto3", "moto[s3]>=5"]
s3 = ["boto3"]

[project.scripts]
edaport = "edaport.cli:main"

[tool.setuptools.packages.find]
include = ["edaport*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["orfs: needs docker + the pinned ORFS image (slow)"]

[tool.setuptools.package-data]
edaport = ["runners/*.cpp"]
